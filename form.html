<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration form</title>
</head>
<body>
    <form action="">
        <h1>Prepare you next trip with us ...</h1>
        <p>Complete this form to contact with you</p>
        <div class="coulonm">
            <div>
                <label for="name">Full Name</label>
                <input type="text" id="Name" required>
            </div>
            <div>
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Write A Valid E-mail">
            </div>
            <div>
                <label for="number">Full Number</label>
                <input type="tel" id="Phone" required>
            </div>

        </div>

    </form>  
</body>
</html>
